<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIBuildApp Store</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#2563eb;--pri2:#1d4ed8;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--nav:#0f172a;--navink:#cbd5e1}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
#app{display:flex;min-height:100vh}
#nav{width:210px;background:var(--nav);color:var(--navink);padding:14px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
#nav .brand{color:#fff;font-weight:700;font-size:16px;padding:4px 10px 14px}
#nav .brand small{display:block;color:#94a3b8;font-weight:400;font-size:11px}
#nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--navink);text-decoration:none;cursor:pointer;margin-bottom:2px}
#nav a:hover{background:#1e293b;color:#fff}
#nav a.on{background:var(--pri);color:#fff}
main{flex:1;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#top h1{font-size:18px;margin:0;flex:1}
#menuBtn{display:none}
#view{padding:20px;max-width:1400px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{color:var(--mut);font-size:12px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
.kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.full{grid-column:1/-1}
label span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--pri)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--pri2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #cbd5e1}
.btn.ghost:hover{background:#f1f5f9}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.warn{background:var(--warn)}
.btn.sm{padding:4px 9px;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input,.bar select{width:auto;min-width:160px}
.bar .grow{flex:1}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;background:#f8fafc;position:sticky;top:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:#f8fafc}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#e2e8f0;color:#334155;white-space:nowrap}
.b-Received,.b-Active,.b-Completed{background:#dbeafe;color:#1e40af}
.b-Diagnosing,.b-In-Repair{background:#ede9fe;color:#5b21b6}
.b-Waiting-Approval,.b-Waiting-Parts{background:#fef3c7;color:#92400e}
.b-Ready{background:#dcfce7;color:#166534}
.b-Delivered{background:#e2e8f0;color:#334155}
.b-Cancelled,.b-Void,.b-Expired{background:#fee2e2;color:#991b1b}
.b-High{background:#fee2e2;color:#991b1b}
.b-Administrator{background:#ede9fe;color:#5b21b6}.b-Technician{background:#e0f2fe;color:#075985}
.mut{color:var(--mut)} .right{text-align:right} .bold{font-weight:700}
.hidden{display:none!important}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:50;overflow:auto}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:16px}
.mhead button{border:0;background:none;font-size:24px;cursor:pointer;color:var(--mut)}
#mbody{padding:18px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#toast{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
#toast div{background:#0f172a;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:360px}
#toast div.err{background:var(--bad)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:90;display:flex;align-items:center;justify-content:center;font-weight:600}
.pos{display:grid;grid-template-columns:1fr 1.25fr;gap:16px}
.plist{max-height:62vh;overflow:auto}
.pitem{display:flex;justify-content:space-between;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.pitem:hover{border-color:var(--pri);background:#eff6ff}
.tot td{border:0;padding:3px 8px}
.tot tr:last-child td{font-size:18px;font-weight:700}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px}
.kv div:nth-child(odd){color:var(--mut)}
.tl{border-left:2px solid var(--line);padding-left:12px}
.tl div{margin-bottom:8px}
.empty{padding:24px;text-align:center;color:var(--mut)}
#print{display:none}
.inrow{display:flex;gap:6px}.inrow input{flex:1;min-width:0}
.scanbtn{display:inline-flex;align-items:center;justify-content:center;padding:6px 9px}
.scanbtn svg{width:18px;height:18px}
#scanner{position:fixed;inset:0;background:rgba(15,23,42,.7);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:80;overflow:auto}
#scanVideo{width:100%;border-radius:10px;background:#000;max-height:55vh}
.scanframe{position:relative}.scanframe:after{content:"";position:absolute;left:12%;right:12%;top:50%;border-top:2px solid #ef4444;box-shadow:0 0 8px #ef4444}
.labels{display:flex;flex-wrap:wrap;gap:6px}
.label{width:2.3in;height:1.2in;border:1px dashed #999;padding:4px;text-align:center;overflow:hidden;page-break-inside:avoid;font-size:10px}
.label b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label svg{max-width:100%;height:.6in}
@media print{
  body{background:#fff}
  #app,#modal,#toast,#busy{display:none!important}
  #print{display:block;font-size:12px;color:#000}
  #print table th{background:#fff}
}
.doc{max-width:760px;margin:0 auto}
.doc h2{margin:0}
.doc .hd{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.sig{margin-top:40px;display:flex;gap:40px}
.sig div{flex:1;border-top:1px solid #000;padding-top:4px}
@media(max-width:900px){
  #nav{position:fixed;left:-230px;z-index:40;transition:left .2s}
  #nav.open{left:0}
  #menuBtn{display:inline-block}
  .pos,.grid3{grid-template-columns:1fr}
  #view{padding:12px}
}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}}
</style>
</head>

const LocalDB={
  key:'aibs_db_v1',
  load(){let d={};try{d=JSON.parse(localStorage.getItem(this.key)||'{}')}catch(e){}TABLES.forEach(x=>d[x]=d[x]||[]);return d},
  save(d){try{localStorage.setItem(this.key,JSON.stringify(d))}catch(e){toast('Browser storage error: '+e.message,'err')}},
  seq(d,table){const k='seq_'+table;let r=d.Settings.find(x=>x.id===k);if(!r){r={id:k,value:0};d.Settings.push(r)}r.value=num(r.value)+1;return (PREFIX[table]||'')+String(r.value).padStart(5,'0')},
  commit(ops){const d=this.load();const nums={};const out=[];
    ops.forEach(op=>{const rec=JSON.parse(JSON.stringify(op.record||{}));const arr=d[op.table];const i=arr.findIndex(r=>r.id===rec.id);
      if(op.action==='delete'){if(i>=0)arr.splice(i,1)}
      else{if(rec.number==='AUTO')rec.number=this.seq(d,op.table);if(rec.number)nums[rec.id]=rec.number;
        Object.keys(rec).forEach(k=>{if(typeof rec[k]==='string'&&rec[k].indexOf('@@num:')===0)rec[k]=nums[rec[k].slice(6)]||''});
        if(i>=0)arr[i]=rec;else arr.push(rec)}
      out.push({table:op.table,action:op.action,record:rec})});
    this.save(d);return out}
};

const lsGet=(k)=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let SESS=(()=>{try{return JSON.parse(lsGet(SESS_KEY)||'null')}catch(e){return null}})();   // {url,token,user:{id,username,name,role}} or {local:true}
const MODE=()=>SESS&&SESS.token?'remote':(SESS&&SESS.local?'local':'none');
const ROLE=()=>MODE()==='local'?'Administrator':((SESS&&SESS.user&&SESS.user.role)||'');

async function remoteCall(body,url){let r;
  try{r=await fetch(url||apiUrl(),{method:'POST',body:JSON.stringify(Object.assign({token:SESS&&SESS.token},body)),redirect:'follow'})}catch(e){throw new Error(t('Cannot reach the Web app URL. Check the URL, your internet, and that the deployment access is "Anyone".'))}
  const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){throw new Error(t('The URL did not return store data. Use the Web app URL that ends in /exec and set access to "Anyone".'))}
  if(!j.ok){if(j.error==='AUTH'){SESS=null;lsSet(SESS_KEY,null);showLogin(t('Your session ended. Please sign in again.'));const e=new Error(t('Your session ended. Please sign in again.'));e._shown=true;throw e}
    if(j.error==='FORBIDDEN')throw new Error(t('Not allowed for your user role.'));throw new Error(t(j.error))}
  return j.data}
const API={
  load(){return MODE()==='remote'?remoteCall({action:'load'}):Promise.resolve(LocalDB.load())},
  commit(ops){return MODE()==='remote'?remoteCall({action:'commit',ops}):Promise.resolve(LocalDB.commit(ops))}
};

function normalize(tb,r){(NUMF[tb]||[]).forEach(k=>r[k]=num(r[k]));(ARRF[tb]||[]).forEach(k=>{if(typeof r[k]==='string'){try{r[k]=JSON.parse(r[k])}catch(e){r[k]=[]}}if(!Array.isArray(r[k]))r[k]=[]});
  ['id','number','sku','barcode','phone','serial','refNumber'].forEach(k=>{if(r[k]!=null&&typeof r[k]!=='string')r[k]=String(r[k])});return r}
function loadSettings(){S=Object.assign({},DEFAULTS);DB.Settings.forEach(r=>{if(!String(r.id).startsWith('seq_'))S[r.id]=r.value});S.taxRate=num(S.taxRate);S.repairWarrantyDays=num(S.repairWarrantyDays)}
async function loadAll(){if(MODE()==='none')return showLogin();busy(true);try{const d=await API.load();if(d._session&&SESS){SESS.user=d._session;lsSet(SESS_KEY,JSON.stringify(SESS))}USER=MODE()==='local'?'':((SESS.user&&SESS.user.name)||d._user||'');TABLES.forEach(x=>DB[x]=(d[x]||[]).map(r=>normalize(x,r)));loadSettings()}catch(e){const m=String((e&&e.message)||e);busy(false);if(MODE()==='none')return;if(!e._shown)toast(t('Error')+': '+m,'err')}finally{busy(false)}if(MODE()!=='none')render()}
function applySaved(s){const arr=DB[s.table];const i=arr.findIndex(r=>r.id===s.record.id);if(s.action==='delete'){if(i>=0)arr.splice(i,1)}else{const r=normalize(s.table,s.record);if(i>=0)arr[i]=r;else arr.push(r)}}

class Tx{
  constructor(){this.ops=[];this.cache={}}
  get(tb,id){const k=tb+':'+id;if(!(k in this.cache)){const o=byId(tb,id);this.cache[k]=o?JSON.parse(JSON.stringify(o)):null}return this.cache[k]}
  put(tb,rec){this.ops.push({table:tb,action:'upsert',record:rec});return rec}
  del(tb,id){this.ops.push({table:tb,action:'delete',record:{id}})}
  /* Kardex movement with weighted-average cost */
  move(pid,o){const p=this.get('Products',pid);if(!p||p.kind==='Service')return 0;
    const qIn=num(o.qtyIn),qOut=num(o.qtyOut);let q=num(p.stock),avg=num(p.avgCost),uc=num(o.unitCost);
    if(qIn>0){const nq=q+qIn;avg=nq>0?(Math.max(q,0)*avg+qIn*uc)/(Math.max(q,0)+qIn):uc;q=nq}
    if(qOut>0){uc=avg;q=q-qOut}
    p.stock=r4(q);p.avgCost=r4(avg);
    this.put('Kardex',{id:uid(),date:o.date||nowISO(),productId:pid,sku:p.sku,type:o.type,ref:o.ref||'',qtyIn:qIn,qtyOut:qOut,unitCost:r4(uc),balanceQty:p.stock,balanceAvgCost:p.avgCost,balanceValue:r2(p.stock*p.avgCost),notes:o.notes||'',user:USER});
    this.put('Products',p);return uc}
  async commit(){const seen=new Set();const ops=[];
    for(let i=this.ops.length-1;i>=0;i--){const o=this.ops[i];const k=o.table+':'+o.record.id+':'+o.action;if(o.action==='upsert'&&seen.has(k))continue;seen.add(k);ops.unshift(o)}
    busy(true);try{const saved=await API.commit(ops);saved.forEach(applySaved);return saved}
    catch(e){toast(t('Error')+': '+(e.message||e),'err');e._shown=true;throw e}
    finally{busy(false)}}
}
async function saveOne(tb,rec){const tx=new Tx();tx.put(tb,rec);const s=await tx.commit();return s[0].record}

function tblSalesMini(rows){if(!rows.length)return `<div class="empty">${t('Nothing here yet')}</div>`;return `<table>${rows.map(s=>`<tr class="click" onclick="showReceipt('${s.id}')"><td>${esc(s.number)}<div class="mut">${esc(custName(s.customerId))}</div></td><td class="n">${money(s.total)}${s.status==='Void'?'<br>'+badge('Void'):''}</td></tr>`).join('')}</table>`}

let CART=null;function newCart(){CART={customerId:'',lines:[],discount:0,payment:'Cash',notes:''}}
VIEWS.pos={html(){if(!CART)newCart();return `<div class="pos"><div class="card"><h3>${t('Products')}</h3><div class="inrow"><input id="pq" placeholder="${t('Search by name, SKU, brand, model…')} / ${t('Barcode')}" oninput="posSearch()" onkeydown="if(event.key==='Enter'){event.preventDefault();posEnter(this.value)}">${scanBtn("scanOpen(c=>posScan(c))")}</div><div id="pres" class="plist" style="margin-top:10px"></div></div><div class="card" id="cart"></div></div>`},after(){posSearch();renderCart();$('#pq').focus()}};
function posSearch(){const q=($('#pq').value||'').toLowerCase();const list=DB.Products.filter(p=>p.active!=='No'&&(!q||[p.name,p.sku,p.barcode,p.brand,p.model,p.category].join(' ').toLowerCase().includes(q))).slice(0,40);
  $('#pres').innerHTML=list.length?list.map(p=>`<div class="pitem" onclick="posAdd('${p.id}')"><div><b>${esc(p.name)}</b><div class="mut">${esc(p.sku)} · ${esc([p.brand,p.model].filter(Boolean).join(' '))}</div></div><div class="right"><b>${money(p.price)}</b><div class="mut">${p.kind==='Service'?t('Service'):t('Stock')+': '+qfmt(p.stock)}</div></div></div>`).join(''):`<div class="empty">${t('Nothing here yet')}</div>`}
function posEnter(v){v=String(v||'').trim();if(!v)return;const p=findProductByCode(v);if(p){posAdd(p.id);$('#pq').value='';posSearch();beep();return}
  const q=v.toLowerCase();const list=DB.Products.filter(p=>p.active!=='No'&&[p.name,p.sku,p.barcode,p.brand,p.model].join(' ').toLowerCase().includes(q));if(list.length===1){posAdd(list[0].id);$('#pq').value='';posSearch()}else if(!list.length)toast(t('Not found')+': '+v,'err')}
function posScan(code){const p=findProductByCode(code);if(!p)return toast(t('Not found')+': '+code,'err');posAdd(p.id);toast(t('Added')+': '+p.name)}
function posAdd(id){const p=byId('Products',id);const ex=CART.lines.find(l=>l.productId===id&&!l.serial);if(ex)ex.qty++;else CART.lines.push({productId:id,sku:p.sku,name:p.name,kind:p.kind,qty:1,price:num(p.price),warrantyDays:num(p.warrantyDays),serial:''});renderCart()}
function posCustom(){CART.lines.push({productId:'',sku:'',name:t('Custom item'),kind:'Service',qty:1,price:0,warrantyDays:0,serial:''});renderCart()}
function cartTotals(){const sub=r2(sum(CART.lines,l=>l.qty*l.price));const disc=r2(CART.discount);const net=r2(sub-disc);const tax=r2(net*S.taxRate/100);return{sub,disc,net,tax,total:r2(net+tax)}}
function renderCart(){const T=cartTotals();
  $('#cart').innerHTML=`<h3>${t('Cart')}</h3><div class="bar"><select class="grow" onchange="CART.customerId=this.value">${opts(custOpts(),CART.customerId)}</select><button class="btn ghost sm" onclick="editCustomer(null,c=>{CART.customerId=c.id;render()})">+ ${t('New customer')}</button></div>
  ${CART.lines.length?`<div class="tw"><table><tr><th>${t('Product')}</th><th>${t('Serial / IMEI')}</th><th class="n">${t('Qty')}</th><th class="n">${t('Price')}</th><th class="n">${t('Warranty days')}</th><th class="n">${t('Total')}</th><th></th></tr>
  ${CART.lines.map((l,i)=>`<tr><td>${l.productId?esc(l.name):`<input value="${esc(l.name)}" onchange="CART.lines[${i}].name=this.value">`}</td><td><div class="inrow"><input id="ser${i}" value="${esc(l.serial)}" style="min-width:110px" onchange="CART.lines[${i}].serial=this.value">${scanBtn(`scanOpen(c=>{CART.lines[${i}].serial=c;renderCart()})`)}</div></td><td class="n"><input type="number" step="any" min="0" value="${l.qty}" style="width:70px" onchange="CART.lines[${i}].qty=num(this.value);renderCart()"></td><td class="n"><input type="number" step="any" value="${l.price}" style="width:95px" onchange="CART.lines[${i}].price=num(this.value);renderCart()"></td><td class="n"><input type="number" value="${l.warrantyDays}" style="width:70px" onchange="CART.lines[${i}].warrantyDays=num(this.value)"></td><td class="n">${money(l.qty*l.price)}</td><td><button class="btn ghost sm" onclick="CART.lines.splice(${i},1);renderCart()">✕</button></td></tr>`).join('')}</table></div>`:`<div class="empty">${t('Cart is empty')}</div>`}
  <div class="bar" style="margin-top:10px"><button class="btn ghost sm" onclick="posCustom()">+ ${t('Custom item')}</button></div>
  <div class="grid2"><label><span>${t('Discount')}</span><input type="number" step="any" value="${CART.discount}" onchange="CART.discount=num(this.value);renderCart()"></label><label><span>${t('Payment')}</span><select onchange="CART.payment=this.value">${opts(PAYMENTS,CART.payment)}</select></label><label class="full"><span>${t('Notes')}</span><input value="${esc(CART.notes)}" onchange="CART.notes=this.value"></label></div>
  <table class="tot" style="margin-top:10px"><tr><td>${t('Subtotal')}</td><td class="n">${money(T.sub)}</td></tr><tr><td>${t('Discount')}</td><td class="n">-${money(T.disc)}</td></tr><tr><td>${esc(S.taxLabel)} ${S.taxRate}%</td><td class="n">${money(T.tax)}</td></tr><tr><td>${t('Total')}</td><td class="n">${money(T.total)}</td></tr></table>
  <div class="actions"><button class="btn ghost" onclick="newCart();renderCart()">${t('Clear')}</button><button class="btn ok" onclick="posComplete()">${t('Complete sale')}</button></div>`}
function checkStock(lines){if(S.allowNegativeStock==='Yes')return;const need={};lines.forEach(l=>{if(l.productId&&l.kind!=='Service')need[l.productId]=(need[l.productId]||0)+num(l.qty)});
  Object.keys(need).forEach(id=>{const p=byId('Products',id);if(p&&num(p.stock)<need[id])fail(`${t('Insufficient stock for')} ${p.name} (${qfmt(p.stock)})`)})}
async function posComplete(){try{
  const lines=CART.lines.filter(l=>num(l.qty)>0);if(!lines.length)fail(t('Cart is empty'));checkStock(lines);
  const T=cartTotals();const tx=new Tx();const saleId=uid();const date=nowISO();const items=[];
  lines.forEach(l=>{let cost=0;if(l.productId&&l.kind!=='Service'){cost=tx.move(l.productId,{type:'SALE',qtyOut:l.qty,ref:'@@num:'+saleId,date})}items.push(Object.assign({},l,{cost:r4(cost)}))});
  const costT=r2(sum(items,i=>i.qty*i.cost));
  tx.ops.unshift({table:'Sales',action:'upsert',record:{id:saleId,number:'AUTO',date,customerId:CART.customerId,items,subtotal:T.sub,discount:T.disc,tax:T.tax,total:T.total,cost:costT,profit:r2(T.net-costT),payment:CART.payment,status:'Completed',repairId:'',notes:CART.notes,user:USER}});
  items.filter(i=>num(i.warrantyDays)>0).forEach(i=>{for(let n=0;n<(i.serial?1:Math.max(1,Math.round(i.qty)));n++)tx.put('Warranties',{id:uid(),number:'AUTO',type:'Sale',refId:saleId,refNumber:'@@num:'+saleId,customerId:CART.customerId,description:i.name,serial:i.serial||'',startDate:today(),endDate:addDays(today(),i.warrantyDays),status:'Active',claims:[],notes:''})});
  await tx.commit();newCart();toast(t('Sale completed'));render();showReceipt(saleId);
}catch(e){if(!e._shown)toast(e.message,'err')}}

  <p>${t('Paid with')}: ${esc(t(s.payment))}</p>${ws.length?`<p><b>${t('Warranties')}:</b> ${ws.map(w=>`${esc(w.number)} (${esc(w.description)} → ${fdate(w.endDate)})`).join('; ')}</p><p class="mut" style="font-size:11px">${esc(S.warrantyTerms)}</p>`:''}
  <p style="text-align:center;margin-top:16px">${esc(S.receiptFooter)}</p></div>`}
function showReceipt(id){const s=byId('Sales',id);if(!s)return;openModal(t('Receipt')+' '+s.number,receiptHTML(s)+`<div class="actions">${s.status!=='Void'?`<button class="btn bad" onclick="voidSale('${s.id}')">${t('Void sale')}</button>`:''}<button class="btn" onclick="printHTML(receiptHTML(byId('Sales','${s.id}')))">${t('Print')}</button></div>`,true)}
function voidSale(id){confirmBox(t('Void sale')+'? '+t('Are you sure?'),async()=>{const tx=new Tx();const s=tx.get('Sales',id);if(s.status==='Void')return;
  (s.items||[]).forEach(i=>{if(i.productId&&i.kind!=='Service')tx.move(i.productId,{type:'VOID',qtyIn:i.qty,unitCost:i.cost,ref:s.number})});
  s.status='Void';tx.ops.unshift({table:'Sales',action:'upsert',record:s});
  DB.Warranties.filter(w=>w.refId===id||(s.repairId&&w.refId===s.repairId&&w.type==='Repair')).forEach(w0=>{const w=tx.get('Warranties',w0.id);w.status='Void';tx.put('Warranties',w)});
  if(s.repairId){const r=tx.get('Repairs',s.repairId);if(r){r.status='Ready';r.saleId='';r.dateOut='';r.history=(r.history||[]).concat([{date:nowISO(),status:'Ready',note:t('Sale voided')+' '+s.number,user:USER}]);tx.put('Repairs',r)}}

   <table><tr><th>${t('Product')}</th><th class="n">${t('Qty')}</th><th class="n">${t('Price')}</th><th class="n">${t('Total')}</th><th></th></tr>${(r.parts||[]).map((p,i)=>`<tr><td>${esc(p.name)} <span class="mut">${esc(p.sku)}</span></td><td class="n">${qfmt(p.qty)}</td><td class="n">${!closed?`<input type="number" step="any" value="${p.price}" style="width:90px" onchange="setPartPrice('${r.id}',${i},this.value)">`:money(p.price)}</td><td class="n">${money(p.qty*p.price)}</td><td>${!closed?`<button class="btn ghost sm" onclick="removeRepairPart('${r.id}',${i})">✕</button>`:''}</td></tr>`).join('')}

async function repairSave(id,fn){try{const tx=new Tx();const r=tx.get('Repairs',id);fn(r);r.total=repairTotal(r);tx.put('Repairs',r);await tx.commit();render()}catch(e){if(!e._shown)toast(e.message,'err')}}
function setRepairStatus(id){const st=$('#rst').value,note=$('#rnote').value;repairSave(id,r=>{r.status=st;r.history=(r.history||[]).concat([{date:nowISO(),status:st,note,user:USER}])}).then(()=>toast(t('Status updated')))}
function addRepairPart(id){const pid=$('#rpp').value,q=num($('#rpq').value);if(!pid||q<=0)return;const p=byId('Products',pid);repairSave(id,r=>{r.parts=(r.parts||[]).concat([{productId:pid,sku:p.sku,name:p.name,qty:q,price:num(p.price)}])})}
function repairScanPart(id,code){const p=findProductByCode(code);if(!p||p.kind==='Service')return toast(t('Not found')+': '+code,'err');repairSave(id,r=>{r.parts=(r.parts||[]).concat([{productId:p.id,sku:p.sku,name:p.name,qty:1,price:num(p.price)}])}).then(()=>toast(t('Added')+': '+p.name))}
function removeRepairPart(id,i){repairSave(id,r=>{r.parts.splice(i,1)})}
function setPartPrice(id,i,v){repairSave(id,r=>{r.parts[i].price=num(v)})}
function deliverRepair(id){const r=byId('Repairs',id);const sub=repairTotal(r);
  openModal(t('Deliver & charge')+' · '+r.number,`<div class="grid2"><label><span>${t('Discount')}</span><input id="dd" type="number" step="any" value="0" oninput="dcalc()"></label><label><span>${t('Payment')}</span><select id="dp">${opts(PAYMENTS,'Cash')}</select></label><label><span>${t('Warranty days')}</span><input id="dw" type="number" value="${num(r.warrantyDays)}"></label></div><table class="tot" id="dtot" style="margin-top:12px"></table><div class="actions"><button class="btn ghost" onclick="closeModal()">${t('Cancel')}</button><button class="btn ok" id="dgo">${t('Deliver & charge')}</button></div>`);
  window.dcalc=()=>{const d=num($('#dd').value),net=sub-d,tax=r2(net*S.taxRate/100);$('#dtot').innerHTML=`<tr><td>${t('Parts used')}</td><td class="n">${money(repairParts(r))}</td></tr><tr><td>${t('Labor')}</td><td class="n">${money(r.labor)}</td></tr><tr><td>${t('Discount')}</td><td class="n">-${money(d)}</td></tr><tr><td>${esc(S.taxLabel)} ${S.taxRate}%</td><td class="n">${money(tax)}</td></tr><tr><td>${t('Total')}</td><td class="n">${money(net+tax)}</td></tr><tr><td>${t('Deposit received')}</td><td class="n">-${money(r.deposit)}</td></tr><tr><td>${t('Balance due')}</td><td class="n">${money(net+tax-num(r.deposit))}</td></tr>`};dcalc();
  $('#dgo').onclick=async()=>{try{const disc=r2($('#dd').value),pay=$('#dp').value,wd=num($('#dw').value);
    const parts=(r.parts||[]).map(p=>Object.assign({},p,{kind:(byId('Products',p.productId)||{}).kind||'Part'}));checkStock(parts);
    const tx=new Tx();const saleId=uid(),date=nowISO();const items=[];
    parts.forEach(p=>{const c=tx.move(p.productId,{type:'REPAIR',qtyOut:p.qty,ref:'@@num:'+saleId,date,notes:r.number});items.push({productId:p.productId,sku:p.sku,name:p.name,kind:p.kind,qty:p.qty,price:p.price,cost:r4(c),serial:'',warrantyDays:0})});
    if(num(r.labor)>0||!items.length)items.push({productId:'',sku:'',name:`${t('Labor')} · ${t(r.deviceType)} ${r.brand} ${r.model}`.trim(),kind:'Service',qty:1,price:num(r.labor),cost:0,serial:r.serial,warrantyDays:wd});
    const subT=r2(sum(items,i=>i.qty*i.price)),net=r2(subT-disc),tax=r2(net*S.taxRate/100),cost=r2(sum(items,i=>i.qty*i.cost));
    tx.ops.unshift({table:'Sales',action:'upsert',record:{id:saleId,number:'AUTO',date,customerId:r.customerId,items,subtotal:subT,discount:disc,tax,total:r2(net+tax),cost,profit:r2(net-cost),payment:pay,status:'Completed',repairId:r.id,notes:`${r.number}${num(r.deposit)?' · '+t('Deposit received')+' '+money(r.deposit):''}`,user:USER}});
    const rr=tx.get('Repairs',id);let wid='';
    if(wd>0){wid=uid();tx.put('Warranties',{id:wid,number:'AUTO',type:'Repair',refId:r.id,refNumber:r.number,customerId:r.customerId,description:`${t(r.deviceType)} ${r.brand} ${r.model} — ${r.problem}`.slice(0,200),serial:r.serial,startDate:today(),endDate:addDays(today(),wd),status:'Active',claims:[],notes:''})}
    Object.assign(rr,{status:'Delivered',dateOut:date,saleId,warrantyId:wid,warrantyDays:wd,total:repairTotal(rr)});rr.history=(rr.history||[]).concat([{date,status:'Delivered',note:'',user:USER}]);
    tx.put('Repairs',rr);await tx.commit();closeModal();toast(t('Repair delivered'));render();showReceipt(saleId);
  }catch(e){if(!e._shown)toast(e.message,'err')}}}

function warrantyHTML(w){const c=byId('Customers',w.customerId)||{};return `<div class="doc">${docHead(t('Warranty certificate'),w.number,w.startDate,1)}<div class="kv"><div>${t('Customer')}</div><div><b>${esc(c.name||t('Walk-in'))}</b> ${esc(c.phone||'')}</div><div>${t('Type')}</div><div>${esc(t(w.type))} · ${esc(w.refNumber)}</div><div>${t('Description')}</div><div>${esc(w.description)}</div><div>${t('Serial / IMEI')}</div><div>${esc(w.serial)}</div><div>${t('Start')}</div><div>${fdate(w.startDate)}</div><div>${t('End')}</div><div><b>${fdate(w.endDate)}</b></div><div>${t('Status')}</div><div>${esc(t(wStatus(w)))}</div></div>
  ${(w.claims||[]).length?`<h3>${t('Claims')}</h3><table><tr><th>${t('Date')}</th><th>${t('Issue')}</th><th>${t('Resolution')}</th></tr>${w.claims.map(c=>`<tr><td>${fdate(c.date)}</td><td>${esc(c.issue)}</td><td>${esc(c.resolution)}</td></tr>`).join('')}</table>`:''}<p class="mut" style="font-size:11px;margin-top:14px">${esc(S.warrantyTerms)}</p><div class="sig"><div>${t('Store')}</div></div></div>`}
function showWarranty(id){const w=byId('Warranties',id);const act=wStatus(w)==='Active';
  openModal(t('Warranty')+' '+w.number,warrantyHTML(w)+`<div class="actions">${w.type==='Repair'?`<button class="btn ghost" onclick="closeModal();go('repair','${w.refId}')">${t('Repair order')}</button>`:(isAdmin()?`<button class="btn ghost" onclick="showReceipt('${w.refId}')">${t('Invoice')}</button>`:'')}${act?`<button class="btn warn" onclick="warrantyClaim('${w.id}')">${t('New claim')}</button>`:''}<button class="btn" onclick="printHTML(warrantyHTML(byId('Warranties','${w.id}')))">${t('Print certificate')}</button></div>`,true)}
function warrantyClaim(id){const w=byId('Warranties',id);
  formModal(t('New claim')+' · '+w.number,[{k:'issue',label:'Issue',type:'textarea',full:true,req:true},{k:'resolution',label:'Resolution',type:'textarea',full:true},{k:'action',label:'Actions',type:'select',opts:[['record',t('Record only')],['repair',t('Create warranty repair order')]],full:true}],{},async v=>{
    const tx=new Tx();const ww=tx.get('Warranties',id);let roId='';
    if(v.action==='repair'){roId=uid();const src=w.type==='Repair'?byId('Repairs',w.refId)||{}:{};tx.put('Repairs',{id:roId,number:'AUTO',dateIn:nowISO(),customerId:w.customerId,deviceType:src.deviceType||'Other',brand:src.brand||'',model:src.model||w.description,serial:w.serial,accessories:'',condition:'',problem:v.issue,diagnosis:'',technician:src.technician||techs()[0]||'',status:'Received',priority:'High',promisedDate:'',estimate:0,labor:0,parts:[],deposit:0,total:0,warrantyDays:0,warrantyId:'',dateOut:'',saleId:'',history:[{date:nowISO(),status:'Received',note:t('Warranty')+' '+w.number,user:USER}],notes:t('Warranty')+' '+w.number})}
    ww.claims=(ww.claims||[]).concat([{date:nowISO(),issue:v.issue,resolution:v.resolution,repairId:roId,user:USER}]);tx.put('Warranties',ww);

VIEWS.inventory={html(){return `<div class="card"><div class="bar"><div class="inrow grow"><input id="iq" placeholder="${t('Search by name, SKU, brand, model…')}" value="${esc(F.iq||'')}" oninput="F.iq=this.value;$('#tbl').innerHTML=tblInventory()">${scanBtn("scanOpen(c=>{F.iq=c;render()})")}</div><select onchange="F.ic=this.value;$('#tbl').innerHTML=tblInventory()">${opts([['',t('All')]].concat(CATEGORIES),F.ic||'')}</select><label><input type="checkbox" style="width:auto" ${F.low?'checked':''} onchange="F.low=this.checked;$('#tbl').innerHTML=tblInventory()"> ${t('Only low stock')}</label>${isAdmin()?`<button class="btn" onclick="editProduct()">+ ${t('New product')}</button>`:''}</div><div id="tbl" class="tw">${tblInventory()}</div></div>`}};
function tblInventory(){const q=(F.iq||'').toLowerCase();const rows=DB.Products.filter(p=>(!F.ic||p.category===F.ic)&&(!F.low||(p.kind!=='Service'&&num(p.stock)<=num(p.minStock)))&&(!q||[p.name,p.sku,p.barcode,p.brand,p.model].join(' ').toLowerCase().includes(q))).sort((a,b)=>String(a.name).localeCompare(b.name));
  if(!rows.length)return `<div class="empty">${t('Nothing here yet')}</div>`;
  if(!isAdmin())return `<table><tr><th>${t('SKU')}</th><th>${t('Name')}</th><th>${t('Kind')}</th><th>${t('Category')}</th><th>${t('Location')}</th><th class="n">${t('Stock')}</th><th class="n">${t('Price')}</th><th class="n">${t('Warranty days')}</th></tr>${rows.filter(p=>p.active!=='No').map(p=>{const low=p.kind!=='Service'&&num(p.stock)<=num(p.minStock);return `<tr><td>${esc(p.sku)}${p.barcode?`<div class="mut">${esc(p.barcode)}</div>`:''}</td><td><b>${esc(p.name)}</b><div class="mut">${esc([p.brand,p.model].filter(Boolean).join(' '))}</div></td><td>${esc(t(p.kind))}</td><td>${esc(t(p.category))}</td><td>${esc(p.location)}</td><td class="n" ${low?'style="color:var(--bad);font-weight:700"':''}>${p.kind==='Service'?'—':qfmt(p.stock)}</td><td class="n">${money(p.price)}</td><td class="n">${qfmt(p.warrantyDays)}</td></tr>`}).join('')}</table>`;
  const val=sum(rows.filter(p=>p.kind!=='Service'),p=>Math.max(0,p.stock)*p.avgCost);
  return `<table><tr><th>${t('SKU')}</th><th>${t('Name')}</th><th>${t('Kind')}</th><th>${t('Category')}</th><th class="n">${t('Stock')}</th><th class="n">${t('Min stock')}</th><th class="n">${t('Avg cost')}</th><th class="n">${t('Price')}</th><th class="n">${t('Margin')}</th><th class="n">${t('Value')}</th><th>${t('Actions')}</th></tr>${rows.map(p=>{const low=p.kind!=='Service'&&num(p.stock)<=num(p.minStock);const mg=p.price?((p.price-p.avgCost)/p.price*100):0;return `<tr style="${p.active==='No'?'opacity:.5':''}"><td>${esc(p.sku)}${p.barcode?`<div class="mut">${esc(p.barcode)}</div>`:''}</td><td><b>${esc(p.name)}</b><div class="mut">${esc([p.brand,p.model].filter(Boolean).join(' '))}</div></td><td>${esc(t(p.kind))}</td><td>${esc(t(p.category))}</td><td class="n" ${low?'style="color:var(--bad);font-weight:700"':''}>${p.kind==='Service'?'—':qfmt(p.stock)}</td><td class="n">${p.kind==='Service'?'—':qfmt(p.minStock)}</td><td class="n">${money(p.avgCost)}</td><td class="n">${money(p.price)}</td><td class="n">${mg.toFixed(1)}%</td><td class="n">${p.kind==='Service'?'—':money(Math.max(0,p.stock)*p.avgCost)}</td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="editProduct('${p.id}')">${t('Edit')}</button> ${p.kind!=='Service'?`<button class="btn ghost sm" onclick="adjustStock('${p.id}')">±</button> <button class="btn ghost sm" onclick="F.kp='${p.id}';go('kardex')">${t('Kardex')}</button>`:''} <button class="btn ghost sm" onclick="printLabels('${p.id}')">${t('Labels')}</button></td></tr>`}).join('')}<tr class="bold"><td colspan="9">${rows.length} ${t('Items')}</td><td class="n">${money(val)}</td><td></td></tr></table>`}
function editProduct(id){const p=id?byId('Products',id):{kind:'Product',category:'Accessories',active:'Yes',warrantyDays:0,minStock:1};
  const f=[{k:'sku',label:'SKU',req:true,scan:true},{k:'barcode',label:'Barcode (UPC/EAN)',scan:true},{k:'name',label:'Name',req:true},{k:'kind',label:'Kind',type:'select',opts:KINDS},{k:'category',label:'Category',type:'select',opts:CATEGORIES},{k:'brand',label:'Brand'},{k:'model',label:'Model'},{k:'price',label:'Price',type:'number'},{k:'minStock',label:'Min stock',type:'number'},{k:'warrantyDays',label:'Warranty days',type:'number'},{k:'location',label:'Location'},{k:'active',label:'Active',type:'select',opts:['Yes','No']}];
  if(!id)f.push({k:'_qty',label:'Initial stock',type:'number'},{k:'_cost',label:'Initial unit cost',type:'number'});
  formModal(id?t('Edit')+' '+p.name:t('New product'),f,p,async v=>{
    if(DB.Products.some(x=>x.sku.toLowerCase()===v.sku.toLowerCase()&&x.id!==id))fail('SKU '+v.sku+' already exists');
    if(v.barcode){const d=DB.Products.find(x=>x.id!==id&&(String(x.barcode||'')===v.barcode||String(x.sku).toLowerCase()===v.barcode.toLowerCase()));if(d)fail(t('Barcode already used by')+' '+d.name)}
    const tx=new Tx();const qty=v._qty,cost=v._cost;delete v._qty;delete v._cost;
    if(id){const rec=Object.assign(tx.get('Products',id),v);tx.put('Products',rec)}
    else{const nid=uid();const rec=Object.assign({id:nid,avgCost:r4(cost),stock:0,createdAt:nowISO()},v);DB.Products.push(rec);tx.cache['Products:'+nid]=Object.assign({},rec);tx.put('Products',tx.cache['Products:'+nid]);
      if(qty>0&&rec.kind!=='Service'){tx.cache['Products:'+nid].avgCost=0;tx.move(nid,{type:'OPEN',qtyIn:qty,unitCost:cost,ref:'OPEN'})}
      try{await tx.commit()}catch(e){DB.Products=DB.Products.filter(x=>x.id!==nid);throw e}toast(t('Saved'));return}
    await tx.commit();toast(t('Saved'))},true)}
function adjustStock(id){const p=byId('Products',id);
  formModal(t('Adjust stock')+' · '+p.name+` (${t('Stock')}: ${qfmt(p.stock)})`,[{k:'mode',label:'Type',type:'select',opts:[['in',t('Adjustment in')],['out',t('Adjustment out')],['count',t('Physical count')]]},{k:'qty',label:'Quantity',type:'number',req:true},{k:'unitCost',label:'Unit cost',type:'number',def:p.avgCost},{k:'notes',label:'Notes',full:true}],{},async v=>{
    const tx=new Tx();let q=v.qty,mode=v.mode;if(mode==='count'){const d=r4(v.qty-num(p.stock));if(!d)return;q=Math.abs(d);mode=d>0?'in':'out'}
    if(q<=0)fail(t('Quantity'));
    tx.move(id,mode==='in'?{type:v.mode==='count'?'COUNT+':'ADJ+',qtyIn:q,unitCost:v.unitCost||p.avgCost,notes:v.notes,ref:'ADJ'}:{type:v.mode==='count'?'COUNT-':'ADJ-',qtyOut:q,notes:v.notes,ref:'ADJ'});
    await tx.commit();toast(t('Saved'))})}

VIEWS.kardex={html(){const prods=DB.Products.filter(p=>p.kind!=='Service').sort((a,b)=>String(a.name).localeCompare(b.name));

function kardexRows(){return DB.Kardex.filter(k=>!F.kp||k.productId===F.kp).sort((a,b)=>String(a.date).localeCompare(b.date))}
function kardexHTML(screen){const p=F.kp&&byId('Products',F.kp);let rows=kardexRows();if(!p&&screen)rows=rows.slice(-300);
  const head=p?`<div class="kpis" style="margin-top:4px"><div class="kpi"><div class="l">${t('Product')}</div><div class="v" style="font-size:16px">${esc(p.sku)} · ${esc(p.name)}</div></div><div class="kpi"><div class="l">${t('Stock')}</div><div class="v">${qfmt(p.stock)}</div></div><div class="kpi"><div class="l">${t('Avg cost')}</div><div class="v">${money(p.avgCost)}</div></div><div class="kpi"><div class="l">${t('Value')}</div><div class="v">${money(p.stock*p.avgCost)}</div></div></div>`:'';
  const body=rows.length?`<table><tr><th>${t('Date')}</th>${p?'':`<th>${t('Product')}</th>`}<th>${t('Movement')}</th><th>${t('Reference')}</th><th class="n">${t('In')}</th><th class="n">${t('Out')}</th><th class="n">${t('Unit cost')}</th><th class="n">${t('Balance qty')}</th><th class="n">${t('Avg cost')}</th><th class="n">${t('Balance value')}</th><th>${t('Notes')}</th></tr>${rows.map(k=>`<tr><td>${fdt(k.date)}</td>${p?'':`<td>${esc(k.sku)} ${esc((byId('Products',k.productId)||{}).name||'')}</td>`}<td>${esc(t(KTYPES[k.type]||k.type))}</td><td>${esc(k.ref)}</td><td class="n">${k.qtyIn?qfmt(k.qtyIn):''}</td><td class="n">${k.qtyOut?qfmt(k.qtyOut):''}</td><td class="n">${money(k.unitCost)}</td><td class="n bold">${qfmt(k.balanceQty)}</td><td class="n">${money(k.balanceAvgCost)}</td><td class="n">${money(k.balanceValue)}</td><td>${esc(k.notes)}</td></tr>`).join('')}${p?`<tr class="bold"><td colspan="3">${t('Total')}</td><td class="n">${qfmt(sum(rows,'qtyIn'))}</td><td class="n">${qfmt(sum(rows,'qtyOut'))}</td><td colspan="5"></td></tr>`:''}</table>`:`<div class="empty">${t('Nothing here yet')}</div>`;
  return screen?head+body:`<div class="doc" style="max-width:none">${docHead(t('Kardex'),p?p.sku+' '+p.name:t('All movements'),nowISO())}${head}${body}</div>`}

let PL=[];
function newPurchase(){PL=[{productId:'',qty:1,unitCost:0}];openModal(t('New purchase'),`<div class="grid2"><label><span>${t('Supplier')}</span><select id="pus">${opts([['','—']].concat(DB.Suppliers.map(s=>[s.id,s.name])),'')}</select></label><label><span>${t('Supplier invoice #')}</span><input id="pui"></label><label><span>${t('Date')}</span><input id="pud" type="date" value="${today()}"></label><label><span>${t('Notes')}</span><input id="pun"></label></div><div id="pul" style="margin-top:12px"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">${t('Cancel')}</button><button class="btn ok" onclick="savePurchase()">${t('Save')}</button></div>`,true);renderPL()}
function renderPL(){const prods=DB.Products.filter(p=>p.kind!=='Service').sort((a,b)=>String(a.name).localeCompare(b.name)).map(p=>[p.id,p.sku+' · '+p.name]);
  $('#pul').innerHTML=`<table><tr><th>${t('Product')}</th><th class="n">${t('Qty')}</th><th class="n">${t('Unit cost')}</th><th class="n">${t('Total')}</th><th></th></tr>${PL.map((l,i)=>`<tr><td><select onchange="PL[${i}].productId=this.value;const p=byId('Products',this.value);if(p&&!PL[${i}].unitCost){PL[${i}].unitCost=p.avgCost};renderPL()">${opts([['','—']].concat(prods),l.productId)}</select></td><td class="n"><input type="number" step="any" style="width:80px" value="${l.qty}" onchange="PL[${i}].qty=num(this.value);renderPL()"></td><td class="n"><input type="number" step="any" style="width:100px" value="${l.unitCost}" onchange="PL[${i}].unitCost=num(this.value);renderPL()"></td><td class="n">${money(l.qty*l.unitCost)}</td><td><button class="btn ghost sm" onclick="PL.splice(${i},1);renderPL()">✕</button></td></tr>`).join('')}<tr class="bold"><td><button class="btn ghost sm" onclick="PL.push({productId:'',qty:1,unitCost:0});renderPL()">+ ${t('Add line')}</button></td><td></td><td>${t('Total')}</td><td class="n">${money(sum(PL,l=>l.qty*l.unitCost))}</td><td></td></tr></table>`}
async function savePurchase(){try{const lines=PL.filter(l=>l.productId&&l.qty>0);if(!lines.length)fail(t('Cart is empty'));const tx=new Tx();const id=uid();const d=$('#pud').value||today();const date=d===today()?nowISO():d+'T12:00:00';
  const items=lines.map(l=>{const p=byId('Products',l.productId);tx.move(l.productId,{type:'PURCHASE',qtyIn:l.qty,unitCost:l.unitCost,ref:'@@num:'+id,date,notes:$('#pui').value});return{productId:l.productId,sku:p.sku,name:p.name,qty:l.qty,unitCost:l.unitCost}});
  tx.ops.unshift({table:'Purchases',action:'upsert',record:{id,number:'AUTO',date,supplierId:$('#pus').value,invoiceRef:$('#pui').value,items,total:r2(sum(items,i=>i.qty*i.unitCost)),notes:$('#pun').value,user:USER}});
  await tx.commit();closeModal();toast(t('Purchase saved'));render()}catch(e){if(!e._shown)toast(e.message,'err')}}

VIEWS.reports={html(){F.pf=F.pf||today().slice(0,8)+'01';F.pt=F.pt||today();const inR=d=>fdate(d)>=F.pf&&fdate(d)<=F.pt;

  const net=sum(sales,netOf),cogs=sum(sales,'cost'),gp=net-cogs,exps=DB.Expenses.filter(e=>inR(e.date)),ex=sum(exps,'amount');
  const grp=(arr,key,val)=>{const m={};arr.forEach(x=>{const k=key(x);m[k]=(m[k]||0)+num(val(x))});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const items=[];sales.forEach(s=>{const f=num(s.subtotal)?netOf(s)/num(s.subtotal):1;(s.items||[]).forEach(i=>items.push(Object.assign({},i,{rev:i.qty*i.price*f})))});

  const row=(l,v,b)=>`<tr ${b?'class="bold"':''}><td>${t(l)}</td><td class="n">${v}</td></tr>`;
  const simple=(title,arr,fmt)=>`<div class="card"><h3>${t(title)}</h3>${arr.length?`<table>${arr.map(([k,v])=>`<tr><td>${esc(t(k))}</td><td class="n">${fmt?fmt(v):money(v)}</td></tr>`).join('')}</table>`:`<div class="empty">—</div>`}</div>`;
  return `<div class="card"><div class="bar"><label>${t('From')} <input type="date" value="${F.pf}" onchange="F.pf=this.value;render()"></label><label>${t('To')} <input type="date" value="${F.pt}" onchange="F.pt=this.value;render()"></label><span class="grow"></span><button class="btn ghost" onclick="printHTML('<div class=doc style=max-width:none>'+docHead(t('Reports'),F.pf+' → '+F.pt,nowISO())+document.querySelector('#rep').innerHTML+'</div>')">${t('Print')}</button></div>
   <div class="bar">${t('Export CSV')}: ${['Sales','Repairs','Customers','Products','Kardex','Warranties','Expenses','Purchases'].map(x=>`<button class="btn ghost sm" onclick="download('${x}.csv',toCSV(DB.${x}),'text/csv')">${t(x==='Products'?'Inventory':x)}</button>`).join('')}</div></div>
  <div id="rep"><div class="grid3"><div class="card"><h3>${t('Income statement')}</h3><table>${row('Product sales',money(sum(prod,netOf)))}${row('Repair services',money(sum(rep,netOf)))}${row('Net sales',money(net),1)}${row('Cost of goods sold','-'+money(cogs))}${row('Gross profit',money(gp),1)}${row('Gross margin',(net?gp/net*100:0).toFixed(1)+'%')}${row('Operating expenses','-'+money(ex))}${row('Net profit',money(gp-ex),1)}${row('Tax collected',money(sum(sales,'tax')))}${row('Transactions',sales.length)}</table></div>
   ${simple('By payment method',grp(sales,s=>s.payment,s=>s.total))}${simple('Expenses by category',grp(exps,e=>e.category,e=>e.amount))}</div>
   <div class="grid2"><div class="card"><h3>${t('Top products')}</h3>${tp.length?`<table><tr><th>${t('Product')}</th><th class="n">${t('Qty sold')}</th><th class="n">${t('Revenue')}</th><th class="n">${t('Profit')}</th></tr>${tp.map(p=>`<tr><td>${esc(p.name)}</td><td class="n">${qfmt(p.qty)}</td><td class="n">${money(p.rev)}</td><td class="n">${money(p.rev-p.cost)}</td></tr>`).join('')}</table>`:'<div class="empty">—</div>'}</div>
   ${simple('Top customers',grp(sales.filter(s=>s.customerId),s=>custName(s.customerId),s=>s.total).slice(0,10))}</div>
   <div class="grid3"><div class="card"><h3>${t('Repairs summary')}</h3><table>${row('Received',repIn.length)}${row('Delivered',repOut.length)}${row('Avg turnaround (days)',tat.toFixed(1))}${row('Open repairs',DB.Repairs.filter(r=>!['Delivered','Cancelled'].includes(r.status)).length)}</table></div>

/* =========================================================
   BARCODES — USB/Bluetooth scanners, camera, photo, labels
   ========================================================= */
const LIBS={
  zxing:['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js','https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'],
  jsbarcode:['https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js','https://unpkg.com/jsbarcode@3.11.6/dist/JsBarcode.all.min.js']};
function loadScript(urls,globalName){if(window[globalName])return Promise.resolve();return new Promise((res,rej)=>{let i=0;const next=()=>{if(i>=urls.length)return rej(new Error(t('Could not load the barcode library (internet connection needed).')));const sc=document.createElement('script');sc.src=urls[i++];sc.onload=()=>window[globalName]?res():next();sc.onerror=next;document.head.appendChild(sc)};next()})}
const SCAN_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>';
function scanBtn(js){return `<button type="button" class="btn ghost scanbtn" title="${t('Scan barcode')}" aria-label="${t('Scan barcode')}" onclick="${js}">${SCAN_ICON}</button>`}
function findProductByCode(code){const c=String(code||'').trim().toLowerCase();if(!c)return null;return DB.Products.find(p=>String(p.barcode||'').toLowerCase()===c)||DB.Products.find(p=>String(p.sku||'').toLowerCase()===c)||null}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.frequency.value=1200;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},90)}catch(e){}}

/* Global lookup: product, INV/RO/WAR/PO numbers, serial/IMEI */
function handleScan(code){code=String(code||'').trim();if(!code)return;
  if(VIEW==='pos')return posScan(code);
  if(VIEW==='repair'&&ARG){const r=byId('Repairs',ARG);const p=findProductByCode(code);if(r&&p&&!['Delivered','Cancelled'].includes(r.status))return repairScanPart(ARG,code)}
  const up=code.toUpperCase();
  const s=DB.Sales.find(x=>String(x.number).toUpperCase()===up);if(s)return showReceipt(s.id);
  const r=DB.Repairs.find(x=>String(x.number).toUpperCase()===up);if(r)return go('repair',r.id);
  const w=DB.Warranties.find(x=>String(x.number).toUpperCase()===up);if(w)return showWarranty(w.id);
  const p=findProductByCode(code);if(p){F.iq=code;return go('inventory')}
  const lc=code.toLowerCase();
  const ws=DB.Warranties.filter(x=>String(x.serial||'').toLowerCase().includes(lc));if(ws.length){F.wq=code;F.ws='';return go('warranties')}
  const rs=DB.Repairs.filter(x=>String(x.serial||'').toLowerCase().includes(lc));if(rs.length===1)return go('repair',rs[0].id);if(rs.length){F.rq=code;F.rs='*';return go('repairs')}
  toast(t('Not found')+': '+code,'err')}

/* Keyboard-wedge scanners (USB / Bluetooth) type very fast and end with Enter */
(function(){let buf='',last=0,fast=0;
  document.addEventListener('keydown',e=>{const tg=e.target,tag=(tg&&tg.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!$('#modal').classList.contains('hidden')||!$('#scanner').classList.contains('hidden'))return;
    const now=Date.now();if(now-last>80){buf='';fast=0}else fast++;last=now;
    if(e.key==='Enter'){if(buf.length>=3&&fast>=buf.length-1){e.preventDefault();const c=buf;buf='';beep();handleScan(c)}buf='';return}
    if(e.key.length===1)buf+=e.key})})();

/* Camera / photo scanner */
let SCAN_CB=null,SCAN_STREAM=null,SCAN_READER=null,SCAN_TIMER=null;
const BD_FORMATS=['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code','data_matrix','pdf417'];
async function getDetector(){if(!('BarcodeDetector' in window))return null;try{const sup=await BarcodeDetector.getSupportedFormats();const f=BD_FORMATS.filter(x=>sup.includes(x));return f.length?new BarcodeDetector({formats:f}):null}catch(e){return null}}
function scanInto(sel){scanOpen(c=>{const el=document.querySelector(sel);if(el){el.value=c;el.dispatchEvent(new Event('change',{bubbles:true}))}})}
async function scanOpen(cb){SCAN_CB=cb;$('#scanTitle').textContent=t('Scan barcode');$('#scanPhotoLbl').firstChild.textContent=t('Photo');$('#scanManual').placeholder=t('Type or scan the code');$('#scanManual').value='';
  $('#scanner').classList.remove('hidden');setTimeout(()=>$('#scanManual').focus(),50);const msg=$('#scanMsg'),video=$('#scanVideo');msg.textContent=t('Starting camera…');video.classList.remove('hidden');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no camera api');
    const det=await getDetector();
    if(det){SCAN_STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=SCAN_STREAM;await video.play();msg.textContent=t('Point the camera at the barcode');
      const loop=async()=>{if(!SCAN_STREAM)return;try{const r=await det.detect(video);if(r&&r.length)return scanDone(r[0].rawValue)}catch(e){}SCAN_TIMER=setTimeout(loop,180)};loop()}
    else{await loadScript(LIBS.zxing,'ZXing');const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);SCAN_READER=new ZXing.BrowserMultiFormatReader(hints,300);
      await SCAN_READER.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},video,(res)=>{if(res)scanDone(res.getText())});msg.textContent=t('Point the camera at the barcode')}
  }catch(e){scanStopCam();video.classList.add('hidden');msg.textContent=t('Camera not available here. Use Photo, a USB/Bluetooth scanner, or type the code.')+(e&&e.name?' ('+e.name+')':'')}}
async function scanPhoto(file){if(!file)return;const msg=$('#scanMsg');msg.textContent=t('Reading photo…');const url=URL.createObjectURL(file);
  try{const det=await getDetector();
    if(det){const img=await createImageBitmap(file);const r=await det.detect(img);if(r&&r.length)return scanDone(r[0].rawValue)}
    await loadScript(LIBS.zxing,'ZXing');const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);const rd=new ZXing.BrowserMultiFormatReader(hints);
    const res=await rd.decodeFromImageUrl(url);return scanDone(res.getText())}
  catch(e){msg.textContent=t('No barcode found. Try again closer, with good light.')}finally{setTimeout(()=>URL.revokeObjectURL(url),2000)}}
function scanStopCam(){clearTimeout(SCAN_TIMER);if(SCAN_READER){try{SCAN_READER.reset()}catch(e){}SCAN_READER=null}if(SCAN_STREAM){SCAN_STREAM.getTracks().forEach(x=>x.stop());SCAN_STREAM=null}const v=$('#scanVideo');if(v&&v.srcObject){try{v.srcObject.getTracks().forEach(x=>x.stop())}catch(e){}v.srcObject=null}}
function scanClose(){scanStopCam();$('#scanner').classList.add('hidden');SCAN_CB=null}
function scanDone(code){code=String(code||'').trim();if(!code)return;const cb=SCAN_CB;scanClose();beep();if(cb)cb(code)}

/* Printable barcode labels (Code 128) */
function printLabels(id){const p=byId('Products',id);
  formModal(t('Print labels')+' · '+p.name,[{k:'code',label:'Code to print',type:'select',opts:[[p.sku,'SKU: '+p.sku]].concat(p.barcode?[[p.barcode,t('Barcode')+': '+p.barcode]]:[])},{k:'qty',label:'Quantity',type:'number',def:Math.max(1,Math.round(num(p.stock)))||1},{k:'price',label:'Show price',type:'select',opts:['Yes','No']}],{},async v=>{
    const n=Math.min(500,Math.max(1,Math.round(v.qty)));const one=`<div class="label"><b>${esc(S.storeName)}</b><b>${esc(p.name)}</b><svg class="bc" data-code="${esc(v.code)}" data-h="38" data-w="1.3"></svg>${v.price==='Yes'?`<b style="font-size:13px">${money(p.price)}</b>`:''}</div>`;
    printHTML(`<div class="labels">${one.repeat(n)}</div>`)})}
